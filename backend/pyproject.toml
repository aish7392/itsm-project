[project]
name = "itsm-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
]

[tool.vercel]
entrypoint = "app.main:app"
